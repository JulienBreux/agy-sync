version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - modernize
    - gocritic
    - perfsprint
    - errorlint
    - nilerr
    - unconvert
    - sloglint
    - testifylint
    - usestdlibvars
    - intrange
    - exptostd
